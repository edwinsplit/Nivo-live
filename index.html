<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico Live Tracking</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

    <!-- Tijdstempel -->
    <div id="last-update" style="
        position:absolute;
        top:10px;
        right:10px;
        background:white;
        padding:6px 10px;
        border-radius:6px;
        font-size:14px;
        box-shadow:0 0 5px rgba(0,0,0,0.3);
        z-index:9999;
    ">
        Laatst bijgewerkt: -
    </div>

    <!-- Kaart -->
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Jouw script -->
    <script type="module" src="script-test.js?v=3000"></script>

</body>
</html>
