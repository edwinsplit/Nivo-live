<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nico Live Tracking</title>

    <!-- Leaflet CSS -->
    <link 
        rel="stylesheet" 
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-sA+4J1rGgGkS2Jp3xNmPR9U1FVLtZLk52I7Di5BkP0A="
        crossorigin=""
    />

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>

    <!-- Tijdstempel rechtsboven -->
    <div id="last-update" style="
        position:absolute;
        top:10px;
        right:10px;
        background:white;
        padding:6px 10px;
        border-radius:6px;
        font-size:14px;
        box-shadow:0 0 5px rgba(0,0,0,0.3);
        z-index:9999;
    ">
        Laatst bijgewerkt: -
    </div>

    <!-- Kaart -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script 
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-o9N1j7kGStG3bU8J8V+RaH59RUW2YCiMWwLrZ8aIu0M="
        crossorigin="">
    </script>

    <!-- Jouw script -->
    <script type="module" src="script-test.js?v=20"></script>

</body>
</html>
